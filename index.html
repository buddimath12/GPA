    <script>
      // Defensive guard for sandbox/iframe environments where window.fetch or Window.prototype.fetch only has a getter
      (function() {
        try {
          var rawFetch = window.fetch;
          var originalFetch = typeof rawFetch === 'function' ? rawFetch.bind(window) : rawFetch;
          var activeFetch = originalFetch;

          var getter = function() {
            return activeFetch;
          };
          var setter = function(fn) {
            activeFetch = fn;
          };

          // Collect all potential targets in window's prototype hierarchy
          var targets = [];
          if (typeof window !== 'undefined') {
            targets.push(window);
          }
          if (typeof Window !== 'undefined' && Window.prototype) {
            targets.push(Window.prototype);
          }

          var p = window;
          while (p) {
            if (targets.indexOf(p) === -1) {
              targets.push(p);
            }
            try {
              p = Object.getPrototypeOf(p);
            } catch (_) {
              break;
            }
          }

          // 1. Redefine or add setter on every prototype where 'fetch' is defined
          for (var i = 0; i < targets.length; i++) {
            var target = targets[i];
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (desc && (!desc.set || !desc.writable)) {
                Object.defineProperty(target, 'fetch', {
                  get: getter,
                  set: setter,
                  configurable: true,
                  enumerable: desc.enumerable !== false
                });
              }
            } catch (_) {}
          }

          // 2. Explicitly define on Window.prototype if possible so inheritance hits setter
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: getter,
                set: setter,
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }

          // 3. Explicitly define on window directly as fallback
          try {
            Object.defineProperty(window, 'fetch', {
              get: getter,
              set: setter,
              configurable: true,
              enumerable: true
            });
          } catch (_) {}

          // 4. Ensure globalThis.fetch also stays consistent
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get: getter,
                set: setter,
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }
        } catch (e) {
          // Graceful fallback
        }
      })();
    </script>
